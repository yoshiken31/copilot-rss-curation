name: curate

on:
  schedule:
    - cron: "30 20 * * *"   # 毎日 05:30 JST
    - cron: "30 2 * * *"   # 毎日 11:30 JST
  workflow_dispatch:
    inputs:
      reevaluate_days:
        description: "再評価する日数（空欄なら通常実行。指定すると処理済みを無視して直近N日分を判定し直し、feed.xmlを作り直す）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Curate
        env:
          INOREADER_FEED_URL: ${{ secrets.INOREADER_FEED_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REEVALUATE_DAYS: ${{ inputs.reevaluate_days }}
        run: python scripts/curate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/usage_log.json state/pending.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update feed and state"
            git push
          fi
